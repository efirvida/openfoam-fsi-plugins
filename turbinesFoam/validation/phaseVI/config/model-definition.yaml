# Phase VI effective-value definition v1.4, the definition of record. Owner
# decision 2026-11-11 (odd/tasks/tip-model-analysis.md L20). Evidence and rationale:
# odd/tasks/validation-model-definition-v1-4-record.md. It equals the frozen v1.3
# (config/model-definition-v1.3.yaml) plus the opt-in near-tip virtual-camber
# correction (Trigaux et al. 2024, F_Cl) on. Registry variant `v1.4` reproduces it on
# the v1.2 base and equals `tip-pitch-dag-sorensen-neartip`.
# Source paths below are relative to turbinesFoam/src/fvOptions/.
# null solver_default means no known default: absence must fail closed.
version: v1.4
pitch_reference: tip # NREL/TP-500-29955 p.20: pitch at the tip chord; mounting at the tip -3.0 deg
coefficients: turbine.axialFlowTurbineALSourceCoeffs
knobs:
  endEffects.active:
    path: endEffects.active
    expected: 'on'
    solver_default: null # axialFlowTurbineALSource/axialFlowTurbineALSource.C:1569 (required lookup)
  endEffectsModel:
    path: endEffects.endEffectsModel
    expected: Glauert
    solver_default: null # axialFlowTurbineALSource/axialFlowTurbineALSource.C:1570 (required lookup)
  tipEffects:
    path: endEffects.GlauertCoeffs.tipEffects
    expected: 'off'
    solver_default: true # axialFlowTurbineALSource/axialFlowTurbineALSource.C:655
  rootEffects:
    path: endEffects.GlauertCoeffs.rootEffects
    expected: 'on'
    solver_default: false # axialFlowTurbineALSource/axialFlowTurbineALSource.C:663
  hubRadius:
    path: hubRadius
    expected: 0.5083
    solver_default: -VGREAT # axialFlowTurbineALSource/axialFlowTurbineALSource.C:1575 (invalid sentinel)
  tipCorrection.active:
    path: tipCorrection.active
    expected: 'on'
    solver_default: false # axialFlowTurbineALSource/axialFlowTurbineALSource.C:1582-1585
  tipCorrection.model:
    path: tipCorrection.model
    expected: DagSorensen
    solver_default: DagSorensen # Dag & Sorensen (2020), the only registered model
  tipCorrection.wakeTurns:
    path: tipCorrection.wakeTurns
    expected: 2
    solver_default: 2
  tipCorrection.wakeAzimuthalStep:
    path: tipCorrection.wakeAzimuthalStep
    expected: 2
    solver_default: 2
  tipCorrection.epsilon:
    path: tipCorrection.epsilon
    expected: 0
    solver_default: 0
  nearTipCorrection.active:
    path: nearTipCorrection.active
    expected: 'on'
    solver_default: false # actuatorLineSource/actuatorLineSource.C createElements: absent block => no correction (opt-in, Trigaux et al. 2024 F_Cl)
  nearTipCorrection.model:
    path: nearTipCorrection.model
    expected: TrigauxVirtualCamber
    solver_default: null # No default: the block must name the model.
  nearTipCorrection.table:
    path: nearTipCorrection.table
    expected: system/trigaux2024_tableC.csv
    solver_default: null # No default table; staged from data/near-tip-functions/trigaux2024_tableC.csv.
  nearTipCorrection.kernel:
    path: nearTipCorrection.kernel
    expected: 3D
    solver_default: null # Trigaux thesis App. C Table C.3 (3D, sigma = c/4); kernel-independent within 0.004.
  nearTipCorrection.sigmaOverC:
    path: nearTipCorrection.sigmaOverC
    expected: 0.25
    solver_default: null # Table C.3 sigma = c/4.
  rotationalAugmentation.active:
    path: rotationalAugmentation.active
    expected: 'off'
    solver_default: false # actuatorLineSource/actuatorLineElement/actuatorLineElement.C:129
  dynamicStall.active:
    path: dynamicStall.active
    expected: 'off'
    solver_default: null # actuatorLineSource/actuatorLineElement/actuatorLineElement.C:116 (required lookup)
  addedMass:
    path: blades.*.addedMass
    expected: false
    solver_default: false # actuatorLineSource/actuatorLineElement/actuatorLineElement.C:882
  velocitySampleRadius:
    path: velocitySampleRadius
    expected: 0
    solver_default: 0.0 # axialFlowTurbineALSource/axialFlowTurbineALSource.C:359
  nVelocitySamples:
    path: nVelocitySamples
    expected: null # Inert for point sampling; deliberately not checked.
    solver_default: 20 # axialFlowTurbineALSource/axialFlowTurbineALSource.C:364
    inert: true
  liftReCorrExp:
    path: profileData.S809.liftReCorrExp
    expected: 0
    solver_default: 0.23 # actuatorLineSource/actuatorLineElement/profileData/profileData.C:714
  meshFactor:
    path: profileData.S809.GaussianCoeffs.meshFactor
    expected: 1
    solver_default: 2.0 # actuatorLineSource/actuatorLineElement/actuatorLineElement.C:534; actuatorSurfaceElement.C:68
    scale_with_refinement: true
  polar:
    path: profileData.S809.data
    expected: data/polars/S809_OSU_Re1M_total.dat
    solver_default: null # No default polar include; input data is required.
    comparison: include_suffix
  nChordwise:
    path: blades.*.nChordwise
    expected: 5
    solver_default: 5 # actuatorLineSource/actuatorLineElement/actuatorSurfaceElement.C:239
    element_type: actuatorSurfaceElement
metadata:
  blade_dz:
    expected: 0.05
    solver_default: null # Not a solver key. Check only when recorded in run.json.
